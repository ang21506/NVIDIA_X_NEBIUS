version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: learnloop-db
    environment:
      POSTGRES_USER: learnloop_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: learnloop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnloop_user -d learnloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: learnloop-backend
    environment:
      DATABASE_URL: postgresql+psycopg://learnloop_user:securepassword@db:5432/learnloop_db
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO_DATA: "false"
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      NEBIUS_MODEL_ID: ${NEBIUS_MODEL_ID:-nvidia/nemotron-3-nano-30b-a3b}
      JWT_SECRET: ${JWT_SECRET:-learnloop-production-random-secret-key-change-me}
      UPLOAD_DIR: /app/backend/data/uploads
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - uploads_data:/app/backend/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: learnloop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
